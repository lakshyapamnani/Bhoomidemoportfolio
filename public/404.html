<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | Bhoomi Dunka Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background-color: #F5F1E8;
        color: #173A5D;
        font-family: 'DM Sans', -apple-system, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        background: #FFFFFF;
        border: 1px solid #E9E2D5;
        box-shadow: 0 20px 50px rgba(18, 57, 93, 0.12);
        max-width: 600px;
        width: 100%;
        padding: 48px 40px;
        position: relative;
      }
      .tape {
        position: absolute;
        top: -14px;
        left: 50%;
        transform: translateX(-50%) rotate(-1.5deg);
        width: 110px;
        height: 28px;
        background: rgba(23, 59, 93, 0.85);
        border: 1px solid #173B5D;
      }
      .tag {
        display: inline-block;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        color: #315D7E;
        background: #E9E2D5;
        padding: 4px 10px;
        border: 1px solid rgba(49, 93, 126, 0.2);
        margin-bottom: 20px;
      }
      .big-num {
        font-family: 'Cormorant Garamond', serif;
        font-size: 80px;
        line-height: 1;
        color: rgba(23, 59, 93, 0.18);
        margin-bottom: -10px;
      }
      h1 {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 36px;
        font-weight: 500;
        color: #173B5D;
        line-height: 1.15;
        margin-bottom: 16px;
      }
      p {
        font-size: 14px;
        line-height: 1.6;
        color: #315D7E;
        margin-bottom: 28px;
      }
      a.btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #173B5D;
        color: #F5F1E8;
        padding: 12px 24px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        text-decoration: none;
        transition: background 0.2s;
      }
      a.btn:hover {
        background: #12395D;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="tape"></div>
      <div class="tag">404 • Lost Document</div>
      <div class="big-num">404</div>
      <h1>This page does not exist in the journal.</h1>
      <p>The page or case study you were seeking might have been moved or removed from this edition of Bhoomi Dunka's portfolio.</p>
      <a href="/" class="btn">← Return to Studio Cover</a>
    </div>
  </body>
</html>
